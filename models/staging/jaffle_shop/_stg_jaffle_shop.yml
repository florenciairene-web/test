models:
  - name: stg_jaffle_shop__customers
    description: the grain of this table is one unique customer per row
    columns:
      - name: customer_id
        description: Primary key for the customers table
        data_tests:
          - unique
          - not_null
      - name: first_name
        data_tests:
          - not_null
      - name: last_name
        data_tests:
          - not_null
  - name: stg_jaffle_shop__orders
    description: One order per row
    columns:
      - name: order_id
        description: Primary ket for the orders table
        data_tests:
          - unique
          - not_null
      - name: status
        description: "{{doc('status')}}"
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - completed
                  - shipped
                  - returned
                  - placed
      - name: customer_id
        data_tests:
          - relationships:
              arguments: 
                to: ref('stg_jaffle_shop__customers')
                field: customer_id
